<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Calendar · APOC Survival</title>
<style>
  :root{
    color-scheme:dark;
    --background:hsl(222 22% 10%);
    --foreground:hsl(42 38% 88%);
    --card-border:hsl(220 16% 24%);
    --primary:hsl(38 92% 50%);
    --primary-foreground:hsl(30 40% 10%);
    --muted-foreground:hsl(220 12% 62%);
    --destructive:hsl(0 62% 46%);
    --scene-image:url("assets/scenes/bastion-streets.webp");
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--background);color:var(--foreground);
    font-family:Georgia,"Times New Roman",serif;line-height:1.5;
    overflow-x:hidden;overflow-x:clip;min-height:100vh;min-height:100dvh;
  }
  body::before{
    content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-2;
    background-image:var(--scene-image);background-size:cover;background-position:center;opacity:.45;
  }
  body::after{
    content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,hsla(222,22%,10%,.62),hsla(222,22%,10%,.86) 46%,hsla(222,22%,10%,.96) 100%);
  }
  .page{max-width:1060px;margin:0 auto;padding:1rem .9rem 2.5rem}
  .topbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem}
  .topbar .spacer{flex:1 1 auto}
  .btn{
    font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
    background:hsla(220,16%,20%,.55);color:var(--foreground);
    border:1px solid var(--card-border);border-radius:999px;
    min-height:34px;padding:6px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
  .btn.primary:hover{color:var(--primary-foreground);opacity:.92}
  .btn.danger:hover{border-color:var(--destructive);color:var(--destructive)}
  .btn.small{min-height:28px;padding:3px 10px;font-size:.78rem}
  h1{font-size:1.25rem;font-weight:500;margin:0;letter-spacing:.02em}
  h1 .gold{color:var(--primary)}
  .today-banner{
    border:1px solid var(--primary);border-radius:12px;background:hsla(38,60%,22%,.35);
    padding:.55rem .9rem;margin-bottom:.9rem;display:flex;gap:.7rem;flex-wrap:wrap;align-items:baseline;
  }
  .today-banner .big{font-size:1.15rem;font-weight:700;color:var(--primary)}
  .today-banner .small{font-size:.8rem;color:var(--muted-foreground)}
  .month-title{font-size:1.35rem;font-weight:600;min-width:11.5rem;text-align:center}
  .month-title .sub{display:block;font-size:.78rem;font-weight:400;color:var(--muted-foreground)}
  .cal-wrap{border:1px solid var(--card-border);border-radius:12px;background:hsla(222,20%,13%,.72);padding:.7rem}
  .tenday-head{display:grid;grid-template-columns:repeat(10,1fr);gap:.35rem;margin-bottom:.35rem}
  .tenday-head span{text-align:center;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:.15rem 0}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:.35rem}
  .grid.fest{grid-template-columns:1fr}
  .day{
    min-height:86px;border:1px solid var(--card-border);border-radius:8px;padding:.3rem .35rem;
    background:hsla(222,20%,16%,.5);cursor:pointer;display:flex;flex-direction:column;gap:.22rem;overflow:hidden;
  }
  .day:hover{border-color:var(--primary)}
  .day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .day.sel{border-color:var(--primary);background:hsla(38,60%,30%,.28)}
  .day.fest{min-height:120px;align-items:center;justify-content:center;text-align:center}
  .day .num{font-size:.95rem;font-weight:700}
  .day.today .num{color:var(--primary)}
  .day .greg{font-size:.62rem;color:var(--muted-foreground);line-height:1.2}
  .day.fest .num{font-size:1.3rem}
  .chip{
    font-size:.68rem;line-height:1.25;border-radius:5px;padding:.08rem .3rem;
    background:hsla(220,16%,26%,.85);border:1px solid var(--card-border);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chip.tag-session{border-color:var(--primary);color:var(--primary)}
  .chip.tag-inworld{border-color:hsl(160 40% 45%);color:hsl(160 45% 70%)}
  .chip.tag-deadline{border-color:var(--destructive);color:hsl(0 70% 75%)}
  .more{font-size:.66rem;color:var(--muted-foreground)}
  .day-panel{margin-top:.9rem;border:1px solid var(--card-border);border-radius:12px;background:hsla(222,20%,13%,.72);padding:.8rem .9rem}
  .day-panel h2{margin:0 0 .2rem;font-size:1.1rem;font-weight:600}
  .day-panel .greg-line{font-size:.82rem;color:var(--muted-foreground);margin-bottom:.5rem}
  .ev{border:1px solid var(--card-border);border-radius:8px;padding:.5rem .6rem;margin-bottom:.45rem;background:hsla(222,20%,16%,.5)}
  .ev .row{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .ev .t{font-weight:600}
  .ev .tag{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--card-border);border-radius:999px;padding:.05rem .45rem;color:var(--muted-foreground)}
  .ev .tag-session{border-color:var(--primary);color:var(--primary)}
  .ev .tag-inworld{border-color:hsl(160 40% 45%);color:hsl(160 45% 70%)}
  .ev .tag-deadline{border-color:var(--destructive);color:hsl(0 70% 75%)}
  .ev .note{font-size:.85rem;color:var(--foreground);opacity:.88;margin-top:.2rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .ev .acts{margin-left:auto;display:flex;gap:.35rem}
  .empty{color:var(--muted-foreground);font-size:.88rem;padding:.3rem 0 .1rem}
  form.ev-form{margin-top:.7rem;border-top:1px dashed var(--card-border);padding-top:.7rem;display:grid;gap:.5rem}
  form.ev-form label{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);display:grid;gap:.25rem}
  form.ev-form input[type="text"],form.ev-form textarea,form.ev-form select{
    font:inherit;font-size:.9rem;color:var(--foreground);background:hsla(222,20%,12%,.8);
    border:1px solid var(--card-border);border-radius:8px;padding:.42rem .55rem;width:100%;
  }
  form.ev-form textarea{resize:vertical;min-height:3.2rem}
  .form-row{display:flex;gap:.6rem;flex-wrap:wrap}
  .form-row label{flex:1 1 12rem}
  .form-acts{display:flex;gap:.5rem;align-items:center}
  .sync{font-size:.74rem;color:var(--muted-foreground)}
  @media (max-width:760px){
    .day{min-height:58px;padding:.2rem .22rem}
    .day .num{font-size:.8rem}
    .day .greg{font-size:.54rem}
    .chip{font-size:.56rem;padding:.05rem .2rem}
    .month-title{min-width:0;font-size:1.1rem;flex:1 1 auto}
    h1{font-size:1.05rem}
    .tenday-head span{font-size:.54rem}
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="btn" href="index.html" title="Back to the Campaign Hub">Campaign Hub</a>
    <h1>APOC Survival <span class="gold">Campaign Calendar</span></h1>
    <span class="spacer"></span>
    <span class="sync" id="calSync">Loading…</span>
  </div>

  <div class="today-banner" id="calTodayBanner">
    <span class="big" id="calTodayBig">Today in Toril: …</span>
    <span class="small" id="calTodaySmall"></span>
  </div>

  <div class="topbar" role="group" aria-label="Faerûnian month navigation">
    <button class="btn" type="button" id="calPrev" title="Previous Faerûnian month">‹ Prev</button>
    <div class="month-title" id="calMonthTitle">…</div>
    <button class="btn" type="button" id="calNext" title="Next Faerûnian month">Next ›</button>
    <button class="btn" type="button" id="calToday" title="Jump back to today in Toril">Today</button>
  </div>

  <div class="cal-wrap">
    <div class="tenday-head" id="calHead" aria-hidden="true"></div>
    <div class="grid" id="calGrid"></div>
  </div>

  <section class="day-panel" id="calDayPanel" aria-live="polite">
    <h2 id="calDayTitle">Pick a day</h2>
    <div class="greg-line" id="calDayGreg"></div>
    <div style="margin-bottom:.5rem"><button class="btn small" type="button" id="calSetToday" title="Make the picked day the current date in Toril">Set as today in Toril</button></div>
    <div id="calDayEvents"></div>
    <form class="ev-form" id="calForm">
      <div class="form-row">
        <label>Title
          <input type="text" id="calFTitle" required maxlength="120" placeholder="What's happening">
        </label>
        <label style="flex:0 1 11rem">Kind
          <select id="calFTag">
            <option value="session">Session</option>
            <option value="inworld">In-world</option>
            <option value="deadline">Deadline</option>
            <option value="note">Note</option>
          </select>
        </label>
      </div>
      <label>Notes
        <textarea id="calFNote" maxlength="600" placeholder="Details, times, who's coming, what's needed"></textarea>
      </label>
      <div class="form-acts">
        <button class="btn primary" type="submit" id="calFSave">Add to this day</button>
        <button class="btn" type="button" id="calFCancel" hidden>Cancel edit</button>
      </div>
    </form>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPABASE_URL = "https://gjvebpbxggmumtslidej.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_lHurlKltZPfNQ5VviUv90g_yiQ7xZSl";
  var STORE_KEY = "campaign_calendar";
  var db = null;
  try { if (window.supabase) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { db = null; }

  /* ===== The Faerûnian calendar (Calendar of Harptos) is PRIMARY. =====
     The real-world (Gregorian) calendar is secondary: it rides along as a
     small note on each day. Conversion anchor, settled with the table's
     existing entries: a Faerûnian day keeps the same day-of-year count as
     its real-world twin, and the Dale Reckoning year is the real-world
     year + 485 — so the campaign's present, 2511 DR, runs with 2026.
     A Faerûnian year: twelve months of thirty days (three tendays each),
     five festival days standing outside the months, and Shieldmeet added
     after Midsummer every fourth year (2512 DR, 2516 DR, …). */
  var DR_OFFSET = 485;
  var MONTH_DEFS = [
    { name: "Hammer",   alt: "Deepwinter",           kind: "month" },
    { name: "Midwinter", alt: "Festival day between Hammer and Alturiak", kind: "festival" },
    { name: "Alturiak", alt: "The Claw of Winter",   kind: "month" },
    { name: "Ches",     alt: "The Claw of Sunsets",  kind: "month" },
    { name: "Tarsakh",  alt: "The Claw of Storms",   kind: "month" },
    { name: "Greengrass", alt: "Festival day between Tarsakh and Mirtul", kind: "festival" },
    { name: "Mirtul",   alt: "The Melting",          kind: "month" },
    { name: "Kythorn",  alt: "The Time of Flowers",  kind: "month" },
    { name: "Flamerule", alt: "Summertide",          kind: "month" },
    { name: "Midsummer", alt: "Festival day between Flamerule and Eleasis", kind: "festival" },
    { name: "Eleasis",  alt: "Highsun",              kind: "month" },
    { name: "Eleint",   alt: "The Fading",           kind: "month" },
    { name: "Highharvestide", alt: "Festival day between Eleint and Marpenoth", kind: "festival" },
    { name: "Marpenoth", alt: "Leaffall",            kind: "month" },
    { name: "Uktar",    alt: "The Rotting",          kind: "month" },
    { name: "Feast of the Moon", alt: "Festival day after Uktar", kind: "festival" },
    { name: "Nightal",  alt: "The Drawing Down",     kind: "month" }
  ];
  var GREG_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var GREG_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var GREG_CUM = [0,31,59,90,120,151,181,212,243,273,304,334]; // non-leap month starts
  var TAG_LABEL = { session: "Session", inworld: "In-world", deadline: "Deadline", note: "Note" };
  var TENDAY = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"];

  function isShieldYear(dr) { return dr % 4 === 0; }
  function periodsFor(dr) {
    var out = [];
    MONTH_DEFS.forEach(function (m) {
      out.push({ name: m.name, alt: m.alt, kind: m.kind, days: m.kind === "month" ? 30 : 1 });
      // Shieldmeet rides between Midsummer and Eleasis once in four years.
      // It carries no day-of-year weight: the days after it keep their twins.
      if (m.name === "Midsummer" && isShieldYear(dr)) out.push({ name: "Shieldmeet", alt: "The leap day, once in four years, after Midsummer", kind: "festival", days: 1, shieldDay: true });
    });
    return out;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // Gregorian (secondary) -> Faerûnian (primary)
  function gregToHarptos(dateStr) {
    var p = dateStr.split("-");
    var gy = +p[0], gm = +p[1], gd = +p[2];
    var doy = GREG_CUM[gm - 1] + gd; // template day-of-year, Feb counted as 28
    var dr = gy + DR_OFFSET;
    return doyToHarptos(dr, doy);
  }
  function doyToHarptos(dr, doy) {
    var periods = periodsFor(dr), acc = 0;
    for (var i = 0; i < periods.length; i++) {
      if (periods[i].shieldDay) continue; // no real-world day maps onto Shieldmeet
      if (doy > acc && doy <= acc + periods[i].days) return { dr: dr, period: i, name: periods[i].name, day: doy - acc, doy: doy };
      acc += periods[i].days;
    }
    return { dr: dr, period: 0, name: "Hammer", day: 1, doy: 1 };
  }
  // Faerûnian -> day-of-year, and -> Gregorian twin (null for Shieldmeet, which has no twin)
  function harptosDoy(dr, periodIdx, day) {
    var periods = periodsFor(dr), acc = 0;
    for (var i = 0; i < periodIdx; i++) { if (!periods[i].shieldDay) acc += periods[i].days; }
    return acc + day;
  }
  function harptosToGreg(dr, periodIdx, day) {
    var periods = periodsFor(dr), p = periods[periodIdx];
    if (!p || p.shieldDay) return null; // Shieldmeet sits between days
    var doy = harptosDoy(dr, periodIdx, day);
    var gy = dr - DR_OFFSET;
    var gm = 1;
    for (var m = 12; m >= 1; m--) { if (doy > GREG_CUM[m - 1]) { gm = m; break; } }
    var gd = doy - GREG_CUM[gm - 1];
    return { gy: gy, gm: gm, gd: gd, key: gy + "-" + pad(gm) + "-" + pad(gd) };
  }
  function hkey(dr, periodIdx, day) { return dr + "|" + periodIdx + "|" + day; }
  function harptosLabel(h) { return h.day + " " + h.name + " " + h.dr + " DR"; }
  function gregLabel(g) { return GREG_MONTHS[g.gm - 1] + " " + g.gd + ", " + g.gy; }
  /* The current date in Toril is set by the table, not by the real-world
     clock. Shaun set it 2026-11-22: two weeks before Pelor's winter
     solstice. The solstice falls on 20 Nightal (its real-world twin is
     December 21), so today in Toril is 6 Nightal 2511 DR. It is stored
     in the shared calendar (todayH) and advanced with the button in the
     day panel. */
  var todayHKey = "2511|16|6";
  function torilToday() {
    var p = todayHKey.split("|");
    var dr = +p[0], pi = +p[1], dy = +p[2];
    return { dr: dr, period: pi, day: dy, name: periodsFor(dr)[pi].name };
  }

  var events = []; // {id, date:"YYYY-MM-DD" (secondary twin), hdate:"DR|period|day" (primary), title, tag, note}
  function evHarptos(e) {
    if (e.hdate) { var p = e.hdate.split("|"); return { dr: +p[0], period: +p[1], day: +p[2], name: periodsFor(+p[0])[+p[1]].name }; }
    return gregToHarptos(e.date);
  }
  function byHarptos(k) { return events.filter(function (e) { var h = evHarptos(e); return hkey(h.dr, h.period, h.day) === k; }); }

  var t0 = torilToday();
  var view = { dr: t0.dr, period: t0.period };
  var selected = todayHKey;
  var editingId = null;

  var grid = document.getElementById("calGrid");
  var head = document.getElementById("calHead");
  var titleEl = document.getElementById("calMonthTitle");
  var dayTitle = document.getElementById("calDayTitle");
  var dayGreg = document.getElementById("calDayGreg");
  var dayEvents = document.getElementById("calDayEvents");
  var syncEl = document.getElementById("calSync");
  var form = document.getElementById("calForm");
  var fTitle = document.getElementById("calFTitle");
  var fTag = document.getElementById("calFTag");
  var fNote = document.getElementById("calFNote");
  var fSave = document.getElementById("calFSave");
  var fCancel = document.getElementById("calFCancel");

  function refreshBanner() {
    var t = torilToday();
    document.getElementById("calTodayBig").textContent = "Today in Toril: " + harptosLabel(t);
    document.getElementById("calTodaySmall").textContent = "real world: " + new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }) + " (secondary)";
  }
  refreshBanner();

  function setSync(msg) { syncEl.textContent = msg; }

  function render() {
    var periods = periodsFor(view.dr);
    var p = periods[view.period];
    var firstGreg = harptosToGreg(view.dr, view.period, 1);
    var lastGreg = harptosToGreg(view.dr, view.period, p.days) || harptosToGreg(view.dr, view.period, 1);
    titleEl.innerHTML = "";
    titleEl.appendChild(document.createTextNode(p.name + " " + view.dr + " DR"));
    var sub = document.createElement("span"); sub.className = "sub";
    sub.textContent = firstGreg ? p.alt + " · real world: " + GREG_SHORT[firstGreg.gm - 1] + " " + firstGreg.gy + (lastGreg && lastGreg.gm !== firstGreg.gm ? " – " + GREG_SHORT[lastGreg.gm - 1] + " " + lastGreg.gy : "") + " (secondary)" : p.alt + " · no real-world twin (secondary calendar has no day for it)";
    titleEl.appendChild(sub);

    head.innerHTML = "";
    grid.className = "grid" + (p.kind === "festival" ? " fest" : "");
    if (p.kind === "month") {
      head.style.display = "grid";
      TENDAY.forEach(function (t) { var s = document.createElement("span"); s.textContent = t; head.appendChild(s); });
    } else head.style.display = "none";

    grid.innerHTML = "";
    var tk = todayHKey;
    for (var dnum = 1; dnum <= p.days; dnum++) {
      var k = hkey(view.dr, view.period, dnum);
      var g = harptosToGreg(view.dr, view.period, dnum);
      var cell = document.createElement("div");
      var isShieldDay = !!p.shieldDay;
      cell.className = "day" + (p.kind === "festival" ? " fest" : "") + (k === tk ? " today" : "") + (k === selected ? " sel" : "");
      cell.setAttribute("role", "button");
      cell.setAttribute("aria-label", dnum + " " + p.name + " " + view.dr + " DR");
      var num = document.createElement("span"); num.className = "num";
      num.textContent = p.kind === "festival" ? p.name : dnum;
      cell.appendChild(num);
      var gl = document.createElement("span"); gl.className = "greg";
      gl.textContent = g ? "real: " + GREG_SHORT[g.gm - 1] + " " + g.gd + ", " + g.gy : "no real-world twin";
      cell.appendChild(gl);
      var evs = byHarptos(k);
      evs.slice(0, 2).forEach(function (e) {
        var c = document.createElement("span"); c.className = "chip tag-" + e.tag; c.textContent = e.title; cell.appendChild(c);
      });
      if (evs.length > 2) { var m = document.createElement("span"); m.className = "more"; m.textContent = "+" + (evs.length - 2) + " more"; cell.appendChild(m); }
      (function (kk) { cell.addEventListener("click", function () { selected = kk; editingId = null; syncForm(); render(); }); })(k);
      grid.appendChild(cell);
    }
    renderDay();
  }

  function renderDay() {
    var parts = selected.split("|");
    var dr = +parts[0], pi = +parts[1], dy = +parts[2];
    var periods = periodsFor(dr), p = periods[pi];
    var isShieldDay = !!p.shieldDay;
    dayTitle.textContent = isShieldDay ? "Shieldmeet " + dr + " DR" : dy + " " + p.name + " " + dr + " DR";
    var g = harptosToGreg(dr, pi, dy);
    dayGreg.textContent = g ? "real world (secondary): " + gregLabel(g) : "Shieldmeet has no real-world twin — it sits between Midsummer and Eleasis, one day in four years.";
    document.getElementById("calSetToday").hidden = (selected === todayHKey);
    dayEvents.innerHTML = "";
    var evs = byHarptos(selected);
    if (!evs.length) {
      var em = document.createElement("div"); em.className = "empty"; em.textContent = "Nothing on this day yet — add the first entry below.";
      dayEvents.appendChild(em);
      return;
    }
    evs.forEach(function (e) {
      var box = document.createElement("div"); box.className = "ev";
      var row = document.createElement("div"); row.className = "row";
      var t = document.createElement("span"); t.className = "t"; t.textContent = e.title;
      var tag = document.createElement("span"); tag.className = "tag tag-" + e.tag; tag.textContent = TAG_LABEL[e.tag] || "Note";
      var acts = document.createElement("span"); acts.className = "acts";
      var eb = document.createElement("button"); eb.className = "btn small"; eb.type = "button"; eb.textContent = "Edit"; eb.title = "Edit this entry";
      eb.addEventListener("click", function () { startEdit(e); });
      var del = document.createElement("button"); del.className = "btn small danger"; del.type = "button"; del.textContent = "Delete"; del.title = "Delete this entry";
      del.addEventListener("click", function () { removeEvent(e.id); });
      acts.appendChild(eb); acts.appendChild(del);
      row.appendChild(t); row.appendChild(tag); row.appendChild(acts);
      box.appendChild(row);
      if (e.note) { var n = document.createElement("div"); n.className = "note"; n.textContent = e.note; box.appendChild(n); }
      dayEvents.appendChild(box);
    });
  }

  function syncForm() {
    if (editingId) {
      var e = events.find(function (x) { return x.id === editingId; });
      if (e) { fTitle.value = e.title; fTag.value = e.tag; fNote.value = e.note || ""; }
      fSave.textContent = "Save changes";
      fCancel.hidden = false;
    } else {
      form.reset(); fTag.value = "session";
      fSave.textContent = "Add to this day";
      fCancel.hidden = true;
    }
  }
  function startEdit(e) { editingId = e.id; syncForm(); fTitle.focus(); }

  function uid() { return "ev" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function save() {
    if (!db) { setSync("Offline — changes are on this device only"); return; }
    setSync("Saving…");
    db.from("site_settings").upsert({ key: STORE_KEY, value: { events: events, todayH: todayHKey } }).then(function (r) {
      setSync(r && r.error ? "Save failed — try again" : "Saved · shared with the table");
    });
  }

  function removeEvent(id) {
    events = events.filter(function (e) { return e.id !== id; });
    if (editingId === id) editingId = null;
    syncForm(); render(); save();
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var title = fTitle.value.trim(); if (!title) return;
    if (editingId) {
      var e = events.find(function (x) { return x.id === editingId; });
      if (e) { e.title = title; e.tag = fTag.value; e.note = fNote.value.trim(); }
      editingId = null;
    } else {
      var parts = selected.split("|");
      var dr = +parts[0], pi = +parts[1], dy = +parts[2];
      var g = harptosToGreg(dr, pi, dy) || harptosToGreg(dr, pi - 1, 1);
      events.push({ id: uid(), date: g.key, hdate: selected, title: title, tag: fTag.value, note: fNote.value.trim() });
    }
    syncForm(); render(); save();
  });
  fCancel.addEventListener("click", function () { editingId = null; syncForm(); });
  document.getElementById("calSetToday").addEventListener("click", function () {
    todayHKey = selected;
    refreshBanner(); render(); save();
  });

  function step(dir) {
    var periods = periodsFor(view.dr);
    var np = view.period + dir, ndr = view.dr;
    if (np < 0) { ndr -= 1; np = periodsFor(ndr).length - 1; }
    if (np >= periods.length) { ndr += 1; np = 0; }
    view = { dr: ndr, period: np };
    render();
  }
  document.getElementById("calPrev").addEventListener("click", function () { step(-1); });
  document.getElementById("calNext").addEventListener("click", function () { step(1); });
  document.getElementById("calToday").addEventListener("click", function () {
    var t = torilToday();
    view = { dr: t.dr, period: t.period };
    selected = todayHKey;
    render();
  });

  function seed() {
    return [
      { id: uid(), date: "2026-11-22", title: "Game session — 11:00 AM", tag: "session", note: "At the table. John Kricks out with the flu; Fransisco away for Thanksgiving, possibly remote." },
      { id: uid(), date: "2026-12-06", title: "Game session — 11:00 AM", tag: "session", note: "At the table." }
    ];
  }

  function load() {
    if (!db) { events = seed(); setSync("Offline — showing this device's copy"); syncForm(); render(); return; }
    db.from("site_settings").select("value").eq("key", STORE_KEY).maybeSingle().then(function (r) {
      var v = r && r.data && r.data.value;
      if (v && Array.isArray(v.events)) { events = v.events; setSync("Shared calendar · live"); }
      else { events = seed(); setSync("Shared calendar · live"); save(); }
      if (v && typeof v.todayH === "string" && v.todayH.split("|").length === 3) {
        todayHKey = v.todayH;
        var t = torilToday();
        view = { dr: t.dr, period: t.period };
        selected = todayHKey;
        refreshBanner();
      }
      syncForm(); render();
    });
  }
  load();
})();
</script>
</body>
</html>

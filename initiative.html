<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John's House — Initiative Tracker · APOC Survival</title>
<style>
  :root{
    color-scheme:dark;
    --background:hsl(222 22% 10%);
    --foreground:hsl(42 38% 88%);
    --card:hsla(222,20%,14%,0);
    --card-foreground:hsl(42 38% 88%);
    --card-border:hsl(220 16% 24%);
    --popover:hsla(222,20%,13%,0);
    --primary:hsl(38 92% 50%);
    --primary-foreground:hsl(30 40% 10%);
    --secondary:hsla(220,16%,20%,0);
    --muted:hsla(220,16%,20%,0);
    --muted-foreground:hsl(220 12% 62%);
    --accent:hsla(222,18%,22%,0);
    --accent-foreground:hsl(42 38% 90%);
    --destructive:hsl(0 62% 46%);
    --border:hsl(220 16% 24%);
    --input:hsl(220 16% 26%);
    --ring:hsl(38 92% 50%);
    --radius:12px;
    --scene-image:url("assets/scenes/bastion-streets.webp");
  }
  body{
    margin:0;background:var(--background);color:var(--foreground);
    font-family:Georgia,"Times New Roman",serif;line-height:1.5;
    overflow-x:hidden;overflow-x:clip;min-height:100vh;
  }
  /* The backdrop: the hub's own pinned scene layer and scrim,
     verbatim — the slideshow cycles --scene-image underneath. */
  body::before{
    content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-2;
    background-image:var(--scene-image);background-size:cover;background-position:center;
    opacity:var(--bg-opacity,.45);transition:opacity 1.5s ease;
  }
  body::after{
    content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-1;pointer-events:none;
    background:
      linear-gradient(180deg,hsla(222,22%,10%,.62),hsla(222,22%,10%,.86) 46%,hsla(222,22%,10%,.96) 100%),
      radial-gradient(ellipse at 50% 0%,transparent 0%,hsla(222,22%,10%,.40) 72%);
  }
  *{box-sizing:border-box}
  a{color:var(--primary)}
  button,input,select,textarea{font:inherit}
  button,select,input,textarea{color:var(--foreground)}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--ring);outline-offset:2px}
  .page{width:min(1180px,100%);margin:0 auto;padding:0 16px 12px}
  .panel{
    background:hsla(222,20%,14%,0);border:1px solid var(--card-border);backdrop-filter:blur(3px);
    border-radius:var(--radius);padding:10px;margin-top:8px;
    box-shadow:0 14px 32px rgba(0,0,0,.18);
  }
  .panel h2{margin:0 0 6px;font-size:clamp(1.3rem,3.4vw,1.7rem);font-weight:500}
  .panel h3{font-weight:500}
  .muted{color:var(--muted-foreground)}
  .small{font-size:.9rem}
  .eyebrow{margin:0 0 2px;color:var(--primary);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
  .btn{
    border:1px solid var(--card-border);background:var(--secondary);color:var(--foreground);
    border-radius:9px;padding:6px 11px;min-height:34px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  }
  .btn:hover{background:var(--accent);color:var(--accent-foreground)}
  .btn.primary{background:transparent;border-color:var(--primary);color:var(--primary);font-weight:700}
  .btn.danger{background:transparent;border-color:var(--destructive);color:#f0b1b1}
  .btn.danger:hover{background:transparent;color:#f0b1b1}
  [hidden]{display:none !important}
  /* Page furniture: a slim top bar tying the page to the hub —
     back to the Campaign Hub on the left, the campaign wordmark
     on the right, both in the hub's own type and colours. */
  .init-topbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-top:12px;flex-wrap:wrap}
  .init-brand{color:var(--primary);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
  /* Campaign Initiative Tracker panel — John's House, full combat
     build (2026-11-18: AC, HP with damage/healing by amount, 3.5
     statuses with hover-only crunch, Roll ALL, Prev, Now/Next,
     Reset combat — the recovered AIDM Roster feature set). Every
     rule is scoped under #initiativePanel so nothing else on the
     page collides with it. */
  #initiativePanel .init-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
  #initiativePanel .init-round{font-weight:700;letter-spacing:.04em}
  #initiativePanel .init-nownext{margin:.35rem 0 0;font-weight:600;min-height:1.2em}
  #initiativePanel .init-form{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
  #initiativePanel .init-form input{font:inherit;padding:.45rem .6rem;border:1px solid var(--card-border);border-radius:8px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-form input[type="number"]{width:5.5rem}
  #initiativePanel .init-form input#initName{flex:1 1 10rem}
  #initiativePanel .init-list{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 .8rem}
  #initiativePanel .init-row{display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--card-border);border-radius:8px;padding:.5rem .6rem}
  #initiativePanel .init-row.active{outline:2px solid var(--mv-blue, #8fb4ff);outline-offset:1px;background:hsla(222,20%,14%,.35)}
  #initiativePanel .init-line1,#initiativePanel .init-line2{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
  #initiativePanel .init-line2{margin-top:.45rem}
  #initiativePanel .init-turn{width:1.1rem;text-align:center;visibility:hidden}
  #initiativePanel .init-row.active .init-turn{visibility:visible}
  #initiativePanel .init-name{flex:1 1 6rem;min-width:0;overflow-wrap:anywhere;font-weight:600;cursor:default}
  #initiativePanel .init-name.struck{text-decoration:line-through}
  #initiativePanel .init-lab{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;opacity:.9}
  #initiativePanel .init-lab input{font:inherit;width:3.6rem;padding:.25rem .4rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-roll,#initiativePanel .init-del,#initiativePanel .init-step,#initiativePanel .init-dmg,#initiativePanel .init-heal{font:inherit;cursor:pointer;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground);padding:.25rem .5rem}
  #initiativePanel .init-hp-group,#initiativePanel .init-amt-group{display:inline-flex;align-items:center;gap:.3rem}
  #initiativePanel .init-hp,#initiativePanel .init-hpmax{font:inherit;width:3.6rem;padding:.25rem .4rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-amt{font:inherit;width:4rem;padding:.25rem .4rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-bar{display:flex;width:100%;align-self:stretch;height:6px;border-radius:3px;background:rgba(127,127,127,.35);margin-top:.45rem;overflow:hidden}
  #initiativePanel .init-bar span{height:100%}
  #initiativePanel .init-hint{font-weight:700;font-style:italic}
  #initiativePanel .init-status-add{font:inherit;font-size:.95rem;font-weight:600;padding:.34rem .45rem;border:1px solid #111;border-radius:6px;background:#fff;color:#111}
  #initiativePanel .init-chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem}
  #initiativePanel .init-chip{background:#fff;color:#000;border:1px solid #111;border-radius:999px;padding:.16rem .35rem .16rem .65rem;font-size:.92rem;font-weight:600;display:inline-flex;align-items:center;gap:.25rem}
  #initiativePanel .init-chip button{font:inherit;font-weight:700;cursor:pointer;border:none;background:transparent;color:#000;padding:0 .25rem;line-height:1}
  /* Per-character notes (Shaun, 2026-11-18): the notes field sits
     on the name line, immediately after the character's name,
     growing to fill the space before the Init field; on narrow
     screens it wraps to its own sub-line right under the name. */
  #initiativePanel .init-notes{flex:1 1 8rem;min-width:6rem;font:inherit;font-size:.9rem;padding:.3rem .5rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  /* Action buttons on TOP (Shaun, 2026-11-18): the controls sit
     right under the header / Now-Next line, above the form and the
     combatant list, and stick to the top of the view while a long
     list scrolls under them. */
  #initiativePanel .init-controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;position:sticky;top:.5rem;z-index:6;margin:.55rem 0;padding:.45rem .5rem;border:1px solid var(--card-border);border-radius:8px;background:hsl(222,20%,14%)}
  /* Phone-side action-bar arranging (Shaun, 2026-11-18): the lock
     row and size row exist only on the phone side (phones and
     tablets); the desktop page never shows them. */
  #initiativePanel .init-lock-row{display:flex;gap:.4rem;align-items:center;justify-content:flex-end;margin:.35rem 0 0}
  body.init-arranging #initiativePanel .init-size-row{display:flex;gap:.45rem;align-items:center;justify-content:flex-end;margin:.35rem 0 0;font-size:.85rem}
  #initiativePanel .init-size-row{display:none}
  #initiativePanel .init-lock-btn{font:inherit;font-size:.8rem;font-weight:600;padding:.3rem .65rem;border:1px solid var(--card-border);border-radius:999px;background:transparent;color:var(--foreground);cursor:pointer}
  #initiativePanel .init-help-line{font-size:.8rem;opacity:.75;margin:.15rem 0 .35rem}
  #initiativePanel .init-help-q{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid #f3c969;border-radius:50%;color:#f3c969;font-weight:700;font-size:12.5px;cursor:help;flex:none}
  .press-tip{position:fixed;z-index:9999;max-width:min(78vw,340px);background:hsl(222,20%,14%);color:#f2ead8;border:1px solid rgba(242,234,216,.45);border-radius:10px;padding:.5rem .7rem;font-size:.92rem;line-height:1.35;box-shadow:0 8px 28px rgba(0,0,0,.5);pointer-events:none}
  [title]{-webkit-touch-callout:none}
  #initiativePanel .init-size-read{font-weight:700;min-width:1.6rem;text-align:center}
  #initiativePanel .init-empty{opacity:.8;font-style:italic}
  #initiativePanel .init-saved{margin-top:1rem}
  #initiativePanel .init-saved h4{margin:0 0 .4rem;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  #initiativePanel .init-saved-row{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem .6rem;border:1px solid var(--card-border);border-radius:8px;margin-bottom:.35rem;font-size:.9rem}
  #initiativePanel .init-saved-row .init-saved-body{flex:1 1 auto;min-width:0}
  #initiativePanel .init-saved-row .when{font-weight:600}
  #initiativePanel .init-saved-del{font:inherit;cursor:pointer;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground);padding:.1rem .5rem;line-height:1.3}
  /* Accessories (Shaun, 2026-11-18 — "put ALL of it in"): combat
     clock, drag handle, saves on the line, Delay/Ready, temp HP and
     nonlethal fields, status durations, the party roster, the
     combat log, the XP tally, saved-scenario Load. */
  #initiativePanel .init-clock{font-weight:600;opacity:.85}
  #initiativePanel .init-worldclock{font-size:.82rem;opacity:.65;font-weight:600}
  #initiativePanel .init-sessout{font-weight:600;opacity:.65}
  #initiativePanel .init-round{cursor:pointer}
  #initiativePanel button.init-clock,#initiativePanel button.init-sessout{font:inherit;background:transparent;color:var(--foreground);border:1px solid var(--card-border);border-radius:999px;padding:.15rem .6rem;cursor:pointer}
  #initiativePanel button.init-clock.running,#initiativePanel button.init-sessout.running{color:#f3c969;border-color:#f3c969;opacity:1}
  #initiativePanel .init-stint{cursor:pointer}
  #initiativePanel .init-clocks{display:inline-flex;gap:.55rem;align-items:center;font-variant-numeric:tabular-nums}
  #initiativePanel .init-stint{font-weight:700}
  #initiativePanel .init-total{opacity:.75;font-size:.88em}
  #initiativePanel .init-drag{cursor:grab;touch-action:none;padding:.2rem .3rem;opacity:.7;user-select:none;-webkit-user-select:none}
  #initiativePanel .init-row.dragging{opacity:.55;outline:2px dashed var(--mv-blue, #8fb4ff);position:relative;z-index:5}
  #initiativePanel .init-dup,#initiativePanel .init-toparty,#initiativePanel .init-delay,#initiativePanel .init-ready,#initiativePanel .init-nlbtn{font:inherit;cursor:pointer;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground);padding:.25rem .5rem}
  #initiativePanel .init-ready.on{background:#f3c969;color:#000;border-color:#f3c969;font-weight:700}
  #initiativePanel .init-surprised{font:inherit;cursor:pointer;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground);padding:.25rem .5rem}
  #initiativePanel .init-surprised.on{background:#ffe1a8;color:#000;border-color:#ffe1a8;font-weight:700}
  #initiativePanel .init-chip.surprised{background:#ffe1a8;color:#111}
  #initiativePanel .init-controls .btn.on{background:#f3c969;color:#111;border-color:#f3c969;font-weight:700}
  #initiativePanel .init-delay.jumpin{background:var(--mv-blue, #8fb4ff);color:#000;border-color:var(--mv-blue, #8fb4ff);font-weight:700}
  #initiativePanel .init-save{width:2.7rem !important}
  #initiativePanel .init-tmp,#initiativePanel .init-nl{font:inherit;width:3.2rem;padding:.25rem .4rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-cr{font:inherit;width:3.2rem;padding:.25rem .4rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-dur{font:inherit;font-weight:600;width:3.9rem;padding:.3rem .45rem;border:1px solid #111;border-radius:6px;background:#fff;color:#111}
  #initiativePanel .init-chip.readied{background:#f3c969;color:#000;border-color:#7a5a08;padding:.16rem .65rem}
  #initiativePanel .init-chip.delaying{background:#e8e8e8;color:#111;border-style:dashed;padding:.16rem .65rem}
  #initiativePanel .init-tally{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;padding:.5rem .7rem;border:1px solid var(--card-border);border-left:4px solid #f3c969;border-radius:8px;background:hsla(222,20%,14%,.5);font-weight:600}
  #initiativePanel .init-tally[hidden]{display:none}
  #initiativePanel .init-tally-x{font:inherit;cursor:pointer;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground);padding:.05rem .5rem;margin-left:auto}
  #initiativePanel .init-party{margin:.55rem 0;padding:.55rem .7rem;border:1px solid var(--card-border);border-radius:8px}
  #initiativePanel .init-party[hidden]{display:none}
  #initiativePanel .init-party h4{margin:0 0 .45rem;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  #initiativePanel .init-party-row{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;padding:.3rem 0;border-bottom:1px dashed rgba(127,127,127,.3)}
  #initiativePanel .init-party-name{font:inherit;flex:1 1 8rem;min-width:5rem;padding:.3rem .5rem;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-party-add{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.55rem}
  #initiativePanel .init-party-add input{font:inherit;flex:1 1 10rem;padding:.45rem .6rem;border:1px solid var(--card-border);border-radius:8px;background:transparent;color:var(--foreground)}
  #initiativePanel .init-log{margin-top:1rem}
  #initiativePanel .init-log h4{margin:0 0 .4rem;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  #initiativePanel .init-logbox{max-height:180px;overflow-y:auto;border:1px solid var(--card-border);border-radius:8px;padding:.45rem .6rem;font-size:.85rem}
  #initiativePanel .init-logbox div{padding:.1rem 0;border-bottom:1px dashed rgba(127,127,127,.25)}
  #initiativePanel .init-logbox div:last-child{border-bottom:none}
  #initiativePanel .init-saved-btns{display:inline-flex;gap:.35rem;flex:none}
  #initiativePanel .init-saved-load{font:inherit;cursor:pointer;border:1px solid var(--card-border);border-radius:6px;background:transparent;color:var(--foreground);padding:.1rem .55rem;line-height:1.3}
  #initiativePanel .init-saved-log{margin-top:.3rem;font-size:.85rem}
  #initiativePanel .init-saved-log summary{cursor:pointer;opacity:.85}
  #initiativePanel .init-controls .btn[disabled]{opacity:.45;cursor:default}
  #initiativePanel .init-controls .btn.armed{background:#7a2020;color:#fff;border-color:#b05050;font-weight:700}
  /* Phone side (Shaun's definition, 2026-11-18): phones AND tablets. */
  @media (max-width:760px), (pointer:coarse) and (max-width:1400px){
    .panel{padding:16px}
    #initiativePanel .init-form input{font-size:16px;min-height:44px}
    #initiativePanel .init-form input#initName{flex:1 1 100%}
    #initiativePanel .init-form input[type="number"]{flex:1 1 0;width:auto}
    #initiativePanel .init-form .btn{min-height:44px;flex:1 1 0}
    #initiativePanel .init-row{padding:.55rem .6rem}
    #initiativePanel .init-lab input,#initiativePanel .init-hp,#initiativePanel .init-hpmax,#initiativePanel .init-amt{font-size:16px;min-height:40px}
    #initiativePanel .init-status-add{font-size:16px;min-height:40px}
    #initiativePanel .init-notes{font-size:16px;min-height:40px}
    #initiativePanel .init-roll,#initiativePanel .init-del,#initiativePanel .init-step,#initiativePanel .init-dmg,#initiativePanel .init-heal,#initiativePanel .init-dup,#initiativePanel .init-toparty,#initiativePanel .init-delay,#initiativePanel .init-ready,#initiativePanel .init-surprised,#initiativePanel .init-nlbtn{min-width:40px;min-height:40px}
    #initiativePanel .init-tmp,#initiativePanel .init-nl,#initiativePanel .init-dur,#initiativePanel .init-cr{font-size:16px;min-height:40px}
    #initiativePanel .init-drag{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
    #initiativePanel .init-party-name,#initiativePanel .init-party-add input{font-size:16px;min-height:40px}
    #initiativePanel .init-party-add .btn{min-height:44px}
    #initiativePanel .init-saved-del,#initiativePanel .init-saved-load{min-width:40px;min-height:40px}
    #initiativePanel .init-head{gap:.35rem .5rem}
    #initiativePanel .init-stint{padding:.3rem .25rem}
    #initiativePanel .init-clock,#initiativePanel .init-sessout{padding:.3rem .15rem}
    #initiativePanel .init-clock,#initiativePanel .init-sessout,#initiativePanel .init-worldclock{font-size:.85rem}
    #initiativePanel .init-controls .btn{min-height:44px}
    #initiativePanel .init-controls #initNextBtn{flex:1 1 100%}
    #initiativePanel .init-lock-row{display:flex;gap:.4rem;align-items:center;justify-content:flex-end;margin:.35rem 0 0}
    #initiativePanel .init-lock-btn{min-height:36px;padding:.35rem .75rem}
    body.init-arranging #initiativePanel .init-size-row{display:flex;gap:.45rem;align-items:center;justify-content:flex-end;margin:.35rem 0 0;font-size:.85rem}
    body.init-arranging #initiativePanel .init-controls .btn{touch-action:none;cursor:grab}
    body.init-arranging #initiativePanel .init-controls .btn.bar-selected{border-color:var(--primary);border-style:solid;box-shadow:0 0 0 2px var(--primary)}
    body.init-arranging #initiativePanel .init-controls .btn.dragging{opacity:.55}
    body.init-arranging #initiativePanel .init-controls .btn.drop-target{border-color:var(--primary);border-style:dashed}
  }
</style>
</head>
<body data-scene="bastion-streets">
<div class="page">
  <div class="init-topbar">
    <a class="btn" href="index.html" title="Back to the Campaign Hub">&#8592; Campaign Hub</a>
    <span class="init-brand">APOC Survival &middot; 2511 DR</span>
  </div>
  <section class="panel" id="initiativePanel" aria-label="John's House Initiative Tracker">
    <div class="init-head">
      <p class="eyebrow" style="margin:0">John's House — Initiative Tracker</p>
      <span class="init-round" id="initRound" title="The current round — click to advance to the next round">Round 1</span>
      <button type="button" class="init-clock" id="initSessIn" title="Click to run the in-combat timer — click it while it runs to turn both timers off">In combat 0:00</button>
      <button type="button" class="init-sessout" id="initSessOut" title="Click to run the out-of-combat timer — click again to turn both off">Out of combat 0:00</button>
      <span class="init-worldclock" id="initWorldClock" title="Time inside the game world — six seconds to a round, so Round 10 is one minute">0:06</span>
      <span class="init-help-q" tabindex="0" role="img" aria-label="Hover any control to see what it does. On a phone or tablet, press and hold instead." title="Hover any control to see what it does. On a phone or tablet, press and hold instead.">?</span><button type="button" class="init-lock-btn" id="initClockResetBtn" title="Click to reset both session timers to zero">Reset timers</button>
    </div>
    <p class="init-help-line">Hold any button — or hover on a computer — and it will explain what it does.</p>
    <p class="init-nownext" id="initNowNext" title="Whose turn it is now, and who acts next"></p>
    <div class="init-lock-row" id="initLockRow">
      <button type="button" class="init-lock-btn" id="initBarResetBtn" hidden>Reset layout</button>
      <button type="button" class="init-lock-btn" id="initLockBtn" aria-pressed="false" title="Unlock to drag the action buttons into your own order and change their footprints; lock to use them as buttons again">&#128275; Move buttons</button>
    </div>
    <div class="init-size-row" id="initSizeRow" hidden>
      <span>Footprint: <strong id="initSizeName">Next turn</strong></span>
      <button type="button" class="init-lock-btn" id="initSizeDown" title="Diminish the selected button's footprint">−</button>
      <span class="init-size-read" id="initSizeRead">M</span>
      <button type="button" class="init-lock-btn" id="initSizeUp" title="Extend the selected button's footprint">+</button>
    </div>
    <div class="init-controls">
      <button type="button" class="btn" id="initNextBtn" title="Move the turn to the next combatant — someone delaying is skipped">Next turn</button>
      <button type="button" class="btn" id="initPrevBtn" title="Move the turn back to the previous combatant">Prev turn</button>
      <button type="button" class="btn" id="initRollAllBtn" title="Roll a fresh d20 + modifier for everyone and go back to rolled order">Roll ALL</button>
      <button type="button" class="btn" id="initRollingBtn" aria-pressed="false" title="Rolling initiative: while on, everyone re-rolls initiative and the order re-sorts at the start of every new round">Rolling: Off</button>
      <button type="button" class="btn" id="initResetBtn" title="Put the turn back on the first combatant and return to Round 1 — nothing else changes">Back to top</button>

/* Everything a new round brings, shared by the Next-turn wrap

   duration ticks, the surprise round ending, and — while the
   rolling toggle is on — a full re-roll and re-sort. Returns

function initNewRound(){
  initState.round = (initState.round || 1) + 1;
  initLog("— Round " + initState.round + " begins —");
  initTickStatuses();
  if (initState.round === 2) initClearSurprise(true);
  if (initState.rolling && initState.list.length) {
    initState.list.forEach(c => { c.init = initRoll(c.mod); });
    initState.manual = false;
    initLog("Rolling initiative — new order rolled for Round " + initState.round + ".");
    const nr = initSorted();
    return nr.length ? nr[0].id : null;
  }
  return null;
}
function initClearSurprise(logIt){

function initAdvance(dir, silent){
  const rows = initSorted(); if (!rows.length) return;
  sessionSettle();

     holder's begins. On the very first advance no stint is open
     yet, so the close is a no-op and the open starts that
     combatant's clock — timing begins with the first turn taken. */
  initCloseStint(initState.turnId, true);
  initState.started = true;
  let i = rows.findIndex(c => c.id === initState.turnId);
  if (i < 0) i = 0;
  const before = initState.turnId;
  const ni = initNextIdx(rows, i, dir);
  /* Stepping forward past the end of the order (ni lands at or
     behind where we started) means a new round: tick durations.
     Stepping backward past the top likewise steps the round back,
     but durations never rewind. */
  let rollingTop = null;
  if (dir > 0 && ni <= i) rollingTop = initNewRound();
  if (dir < 0 && ni >= i) initState.round = Math.max(1, (initState.round || 1) - 1);
  initState.turnId = rollingTop || rows[ni].id;

function initNext(){ initAdvance(1); }
function initPrev(){ initAdvance(-1); }
function initJumpIn(c){

  if (hi < 0) return;
  const holder = rows[hi];
  const order = rows.filter(x => x.id !== c.id);
  const at = order.findIndex(x => x.id === holder.id);
  order.splice(at + 1, 0, c);
  order.forEach((x, idx) => { x.seq = idx + 1; });

async function loadInitiative(){

    if (v && Array.isArray(v.list)) initState = {
      list: v.list.map(initNorm),
      turnId: v.turnId ?? null,
      round: v.round || 1,
      started: !!v.started,
      saved: Array.isArray(v.saved) ? v.saved : [],

/* Saves are SERIALIZED and the poll never rewinds (fix, 2026-11-18):
   every save queues behind the previous one and carries a snapshot
   of the state at its own call, so writes land in the order they
   were issued; while any save is in flight the board is "dirty" and
   the 5-second poll skips its reload, so a mid-flight read can
   never replace fresh local work (damage, log lines) with a stale
   stored state. */
let initSaveChain = Promise.resolve();
let initSaveGen = 0;
let initDirty = false;
function saveInitiative(){
  if (!db) return;
  initDirty = true;
  const myGen = ++initSaveGen;
  const snap = JSON.parse(JSON.stringify(initState));
  initSaveChain = initSaveChain.then(async () => {
    try {
      await db.from(SETTINGS_TABLE).upsert(
        { key: INIT_KEY, value: snap, updated_at: new Date().toISOString() },
        { onConflict: "key" }

    } catch (e) {}
    if (myGen === initSaveGen) initDirty = false;

function initAdd(){
  const nameEl = $("initName"), totalEl = $("initTotal"), modEl = $("initMod"), acEl = $("initAc"), hpEl = $("initHp"), qtyEl = $("initQty");
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const mod = parseInt(modEl.value, 10) || 0;
  const typed = totalEl.value !== "" ? (parseInt(totalEl.value, 10) || 0) : null;
  const ac = acEl.value === "" ? null : (parseInt(acEl.value, 10) || 0);
  const maxHp = hpEl.value === "" ? null : (parseInt(hpEl.value, 10) || 0);
  let qty = qtyEl ? (parseInt(qtyEl.value, 10) || 1) : 1;
  qty = Math.max(1, Math.min(50, qty));
  let seq = initState.list.reduce((m, c) => Math.max(m, c.seq || 0), 0);
  for (let k = 1; k <= qty; k++) {
    seq += 1;
    initState.list.push(initNorm({
      id: initUid(),
      name: qty > 1 ? name + " " + k : name,
      init: typed !== null ? typed : initRoll(mod),
      mod, ac, hp: maxHp, maxHp,
      statuses: [], notes: "", seq
    }));

  initPinTop();
  if (!initState.turnId) initState.turnId = initSorted()[0].id;

function initAddParty(){

  roster.forEach(p => {
    if (initState.list.some(c => c.name === p.name)) return;
    seq += 1; added += 1;
    initState.list.push(initNorm({
      id: initUid(), name: p.name, init: initRoll(p.mod), mod: p.mod, ac: p.ac,
      hp: p.maxHp, maxHp: p.maxHp, fort: p.fort, ref: p.ref, will: p.will,
      statuses: [], notes: "", seq

   unlocked, taps fire nothing. Locking restores normal use. Order
   and footprints save per device. Built phone-side first (v51.55);
   Shaun extended it to the laptop side the same day — it now runs
   at every width; every load starts locked. */
(function () {
  var bar = document.querySelector("#initiativePanel .init-controls");
  var lockBtn = document.getElementById("initLockBtn");
  var resetBtn = document.getElementById("initBarResetBtn");
  var sizeRow = document.getElementById("initSizeRow");
  var sizeName = document.getElementById("initSizeName");
  var sizeRead = document.getElementById("initSizeRead");
  var sizeDown = document.getElementById("initSizeDown");
  var sizeUp = document.getElementById("initSizeUp");
  if (!bar || !lockBtn || !resetBtn) return;
  var KEY = "apoc-init-bar-v1";
  var btns = Array.prototype.slice.call(bar.querySelectorAll(".btn"));
  var shipped = btns.map(function (b) { return b.id; });
  var LEVELS = ["S", "M", "L", "XL"];
  var arranging = false;
  var selectedId = shipped[0];

  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function save(layout) {
    try { localStorage.setItem(KEY, JSON.stringify(layout)); } catch (e) {}
  }
  function applySize(btn, level) {
    if (level === 0) { btn.style.flex = "0 1 auto"; btn.style.padding = ".32rem .55rem"; btn.style.fontSize = ".85rem"; }
    else if (level === 2) { btn.style.flex = "1 1 34%"; btn.style.padding = ""; btn.style.fontSize = ""; }
    else if (level === 3) { btn.style.flex = "1 1 100%"; btn.style.padding = ""; btn.style.fontSize = ""; }
    else { btn.style.flex = ""; btn.style.padding = ""; btn.style.fontSize = ""; }
    btn.setAttribute("data-size", String(level));
  }
  function currentLayout() {
    var sizes = {};
    btns.forEach(function (b) {
      var lv = parseInt(b.getAttribute("data-size") || "1", 10);
      if (lv !== 1) sizes[b.id] = lv;
    });
    return { order: Array.prototype.slice.call(bar.querySelectorAll(".btn")).map(function (b) { return b.id; }), sizes: sizes };
  }
  function applyLayout() {
    var layout = load();
    if (!layout || !layout.order) {
      shipped.forEach(function (id) { var b = document.getElementById(id); if (b) bar.appendChild(b); });
      btns.forEach(function (b) { applySize(b, 1); b.removeAttribute("data-size"); });
      return;
    }
    layout.order.forEach(function (id) { var b = document.getElementById(id); if (b) bar.appendChild(b); });
    btns.forEach(function (b) { applySize(b, (layout.sizes || {})[b.id] != null ? (layout.sizes || {})[b.id] : 1); });
  }
  function select(id) {
    selectedId = id;
    btns.forEach(function (b) { b.classList.toggle("bar-selected", arranging && b.id === id); });
    var b = document.getElementById(id);
    if (b && sizeName) sizeName.textContent = (b.textContent || id).trim();
    if (b && sizeRead) sizeRead.textContent = LEVELS[parseInt(b.getAttribute("data-size") || "1", 10)];
  }
  function setArranging(on) {
    arranging = on;
    document.body.classList.toggle("init-arranging", on);
    lockBtn.textContent = on ? "\uD83D\uDD12 Lock buttons" : "\uD83D\uDD13 Move buttons";
    lockBtn.setAttribute("aria-pressed", on ? "true" : "false");
    resetBtn.hidden = !on;
    if (sizeRow) sizeRow.hidden = !on;
    select(selectedId);
  }
  lockBtn.addEventListener("click", function () { setArranging(!arranging); });
  resetBtn.addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    applyLayout(); select(shipped[0]);
  });
  function stepSize(dir) {
    var b = document.getElementById(selectedId);
    if (!b) return;
    var lv = parseInt(b.getAttribute("data-size") || "1", 10);
    lv = Math.max(0, Math.min(3, lv + dir));
    applySize(b, lv);
    if (sizeRead) sizeRead.textContent = LEVELS[lv];
    save(currentLayout());
  }
  if (sizeDown) sizeDown.addEventListener("click", function () { stepSize(-1); });
  if (sizeUp) sizeUp.addEventListener("click", function () { stepSize(1); });

  /* While arranging, a tap on an action button selects it — the
     button's own action never fires. */
  bar.addEventListener("click", function (ev) {
    if (arranging) {
      ev.preventDefault(); ev.stopPropagation();
      var b = ev.target.closest && ev.target.closest(".btn");
      if (b && bar.contains(b)) select(b.id);
    }
  }, true);

  var dragBtn = null, dragTarget = null, startX = 0, startY = 0, dragging = false;
  bar.addEventListener("pointerdown", function (ev) {
    if (!arranging) return;
    var b = ev.target.closest && ev.target.closest(".btn");
    if (!b || !bar.contains(b)) return;
    select(b.id);
    dragBtn = b; dragTarget = null; dragging = false;
    startX = ev.clientX; startY = ev.clientY;
    try { b.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  bar.addEventListener("pointermove", function (ev) {
    if (!arranging || !dragBtn) return;
    if (Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) > 9) {
      dragging = true; dragBtn.classList.add("dragging");
    }
    if (!dragging) return;
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var t = el && el.closest ? el.closest(".btn") : null;
    if (t && t !== dragBtn && bar.contains(t)) {
      if (dragTarget) dragTarget.classList.remove("drop-target");
      dragTarget = t; t.classList.add("drop-target");
    }
  });
  function endDrag() {
    if (!dragBtn) return;
    if (dragging && dragTarget && dragTarget !== dragBtn) {
      var kids = Array.prototype.slice.call(bar.querySelectorAll(".btn"));
      var i = kids.indexOf(dragBtn), j = kids.indexOf(dragTarget);
      kids[i] = dragTarget; kids[j] = dragBtn;
      kids.forEach(function (k) { bar.appendChild(k); });
      save(currentLayout());
    }
    if (dragTarget) dragTarget.classList.remove("drop-target");
    dragBtn.classList.remove("dragging");
    dragBtn = null; dragTarget = null; dragging = false;
  }
  bar.addEventListener("pointerup", endDrag);
  bar.addEventListener("pointercancel", endDrag);

  applyLayout();
})();
</script>

<script>
/* Press-and-hold help (Shaun, 2026-11-18): the hover
   explanations work on BOTH sides — hover with a mouse, and on
   touch screens press and hold any control to read what it
   does, without the control firing. Same words both sides. */
(() => {
  let timer = null, target = null, sx = 0, sy = 0, fired = false;
  const tip = document.createElement("div");
  tip.className = "press-tip";
  tip.hidden = true;
  document.body.appendChild(tip);
  function show(el){
    const text = el.getAttribute("title");
    if (!text) return;
    tip.textContent = text;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
    let y = r.top - th - 10;
    if (y < 8) y = Math.min(r.bottom + 10, window.innerHeight - th - 8);
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hide(){ tip.hidden = true; }
  function cancel(){ if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch" && e.pointerType !== "pen") return;
    const el = e.target.closest ? e.target.closest("[title]") : null;
    cancel(); hide(); fired = false;
    if (!el) { target = null; return; }
    target = el; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { fired = true; show(el); }, 550);
  }, true);
  document.addEventListener("pointermove", e => {
    if (target && (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12)) { cancel(); hide(); }
  }, true);
  ["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, () => { cancel(); setTimeout(hide, 60); }, true));
  document.addEventListener("scroll", () => { cancel(); hide(); }, true);
  document.addEventListener("click", e => {
    if (fired) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); fired = false; }
  }, true);
  document.addEventListener("contextmenu", e => {
    if (fired || (e.target.closest && e.target.closest("[title]"))) e.preventDefault();
  }, true);
})();
</script>
</body>
